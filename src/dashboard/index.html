<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Router</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-bg-strong: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
      --text-primary: #e8e8f0;
      --text-secondary: #9090b0;
      --text-muted: #6060a0;
      --accent-blue: #00d4ff;
      --accent-purple: #b44dff;
      --accent-green: #00ffaa;
      --accent-red: #ff4d6a;
      --accent-yellow: #ffd000;
      --blur: 20px;
      --radius: 16px;
      --radius-sm: 10px;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    a { color: var(--accent-blue); text-decoration: none; }

    /* ==================== Animated Background ==================== */
    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 40%, #0a1a2e 70%, #0a0a1a 100%);
      z-index: -2;
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; z-index: -1;
      pointer-events: none; will-change: transform;
    }
    .bg-orb-1 {
      width: 500px; height: 500px; top: -10%; left: -5%;
      background: radial-gradient(circle, var(--accent-purple), transparent 70%);
      animation: float1 20s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 400px; height: 400px; top: 50%; right: -8%;
      background: radial-gradient(circle, var(--accent-blue), transparent 70%);
      animation: float2 25s ease-in-out infinite;
    }
    .bg-orb-3 {
      width: 350px; height: 350px; bottom: -5%; left: 30%;
      background: radial-gradient(circle, #1a3a6a, transparent 70%);
      animation: float3 22s ease-in-out infinite;
    }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px, -80px); } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, -50px); } }
    @media (prefers-reduced-motion: reduce) {
      .bg-orb { animation: none !important; }
    }

    /* ==================== Glass Components ==================== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow-hover);
    }
    .glass-static {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
    }

    /* ==================== Layout ==================== */
    .layout { display: flex; min-height: 100vh; }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: 240px; flex-shrink: 0; padding: 24px 0;
      background: rgba(10, 10, 26, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
    }
    .sidebar .logo {
      padding: 0 24px 24px; margin-bottom: 8px;
      border-bottom: 1px solid var(--glass-border);
    }
    .sidebar .logo h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700; font-size: 20px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar .logo p {
      font-size: 11px; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;
    }
    .sidebar nav { flex: 1; padding: 8px 12px; }
    .sidebar a {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: var(--radius-sm);
      color: var(--text-secondary); font-size: 14px; font-weight: 500;
      transition: all 0.2s ease; position: relative;
      margin-bottom: 2px;
    }
    .sidebar a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }
    .sidebar a.active {
      color: var(--accent-blue);
      background: rgba(0, 212, 255, 0.08);
      box-shadow: inset 3px 0 0 var(--accent-blue);
    }
    .sidebar a.active i { color: var(--accent-blue); }
    .sidebar a i { width: 18px; height: 18px; opacity: 0.7; transition: opacity 0.2s; }
    .sidebar a:hover i { opacity: 1; }
    .sidebar .logout-section { padding: 12px; }
    .sidebar .logout-section a {
      color: var(--accent-red); opacity: 0.7;
    }
    .sidebar .logout-section a:hover { opacity: 1; }

    /* ==================== Main Content ==================== */
    .main {
      flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px;
      animation: fadeIn 0.4s ease;
    }
    .header h1 { font-size: 26px; font-weight: 700; color: var(--text-primary); }
    .header .user-info { font-size: 13px; color: var(--text-muted); }
    .header .user-info span { color: var(--text-secondary); }

    /* ==================== Cards Grid ==================== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .card {
      padding: 24px; cursor: pointer;
      animation: slideUp 0.5s ease both;
    }
    .card:active { transform: translateY(-1px) scale(0.98); }
    .card .link-hint {
      font-size: 10px; color: var(--text-muted); margin-top: 6px;
      opacity: 0; transition: opacity 0.2s;
    }
    .card:hover .link-hint { opacity: 1; }
    .card:nth-child(1) { animation-delay: 0s; }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }
    .card:nth-child(6) { animation-delay: 0.25s; }
    .card:hover { transform: translateY(-3px); }
    .card .label {
      font-size: 11px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px; font-weight: 500;
    }
    .card .value {
      font-family: 'Outfit', sans-serif;
      font-size: 30px; font-weight: 700;
    }
    .card .value.green { background: linear-gradient(135deg, var(--accent-green), #00cc88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.yellow { background: linear-gradient(135deg, var(--accent-yellow), #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.blue { background: linear-gradient(135deg, var(--accent-blue), #0088cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.purple { background: linear-gradient(135deg, var(--accent-purple), #8833cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }

    /* ==================== Table ==================== */
    .table-wrap {
      animation: fadeIn 0.5s ease 0.1s both;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 16px;
      color: var(--text-muted); font-weight: 500; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--glass-border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-secondary);
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px; border-radius: 6px; font-size: 12px;
      color: var(--accent-blue);
    }

    /* ==================== Buttons ==================== */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg); color: var(--text-primary);
      cursor: pointer; font-size: 13px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transform: translateY(-1px);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: none; color: #fff;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
    }
    .btn.primary:hover {
      box-shadow: 0 6px 28px rgba(0, 212, 255, 0.35);
      transform: translateY(-2px);
    }
    .btn.danger {
      border-color: rgba(255, 77, 106, 0.3); color: var(--accent-red);
    }
    .btn.danger:hover {
      background: rgba(255, 77, 106, 0.1);
      border-color: var(--accent-red);
      box-shadow: 0 4px 16px rgba(255, 77, 106, 0.15);
    }
    .btn.sm { padding: 5px 12px; font-size: 12px; }

    /* ==================== Form / Modal ==================== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: rgba(18, 18, 42, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 32px; min-width: 420px; max-width: 600px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      animation: modalIn 0.3s ease;
    }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      margin-bottom: 20px; font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal .field { margin-bottom: 16px; }
    .modal label {
      display: block; font-size: 12px; color: var(--text-muted);
      margin-bottom: 6px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(255,255,255,0.06);
    }
    .modal select option { background: var(--bg-secondary); }
    .modal .actions {
      margin-top: 24px; display: flex; gap: 10px; justify-content: flex-end;
    }

    /* ==================== Badges ==================== */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
    }
    .badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .badge.active { background: rgba(0, 255, 170, 0.08); color: var(--accent-green); }
    .badge.active::before { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .badge.inactive { background: rgba(255, 77, 106, 0.08); color: var(--accent-red); }
    .badge.inactive::before { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
    .badge.success { background: rgba(0, 255, 170, 0.08); color: var(--accent-green); }
    .badge.success::before { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .badge.error { background: rgba(255, 77, 106, 0.08); color: var(--accent-red); }
    .badge.error::before { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

    /* ==================== Chart ==================== */
    .charts-grid {
      display: flex; flex-direction: column; gap: 16px;
      margin-bottom: 28px;
    }
    .chart-card {
      padding: 20px; animation: slideUp 0.5s ease both;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .chart-card.highlight {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .chart-card:nth-child(1) { animation-delay: 0.1s; }
    .chart-card:nth-child(2) { animation-delay: 0.15s; }
    .chart-card:nth-child(3) { animation-delay: 0.2s; }
    .chart-card .chart-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .chart-card .chart-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .chart-card canvas { width: 100% !important; height: 200px !important; }

    /* ==================== Pagination ==================== */
    .pagination {
      margin-top: 20px; display: flex; gap: 8px;
      align-items: center; font-size: 13px; color: var(--text-muted);
    }
    .pagination button {
      padding: 6px 12px; background: var(--glass-bg);
      border: 1px solid var(--glass-border); border-radius: 8px;
      color: var(--text-primary); cursor: pointer;
      transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
    }
    .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ==================== Login ==================== */
    .login-container {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .login-box {
      width: 400px; padding: 48px;
      background: rgba(18, 18, 42, 0.6);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: modalIn 0.5s ease;
    }
    .login-box h1 {
      text-align: center; margin-bottom: 8px; font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-box .subtitle {
      text-align: center; color: var(--text-muted); font-size: 13px;
      margin-bottom: 32px;
    }
    .login-box .field { margin-bottom: 20px; }
    .login-box label {
      display: block; font-size: 12px; color: var(--text-muted);
      margin-bottom: 8px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-box input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }
    .login-box input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .login-box .btn { width: 100%; padding: 12px; justify-content: center; font-size: 14px; margin-top: 8px; }
    .login-box .error { color: var(--accent-red); font-size: 13px; margin-top: 12px; text-align: center; }

    /* ==================== Utility ==================== */
    .hidden { display: none !important; }
    .toolbar {
      display: flex; gap: 10px; margin-bottom: 20px;
      align-items: center; flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 8px 14px; background: var(--glass-bg);
      border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    .toolbar input:focus, .toolbar select:focus {
      outline: none; border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .empty {
      text-align: center; color: var(--text-muted); padding: 60px 20px;
      font-size: 14px;
    }

    /* ==================== Route Card ==================== */
    .route-entry {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.03);
      padding: 6px 14px; border-radius: 8px;
      font-size: 12px; color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.04);
    }
    .route-entry .tag {
      font-weight: 600; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .route-entry .tag.primary { color: var(--accent-green); }
    .route-entry .tag.fallback { color: var(--text-muted); }

    /* ==================== Animations ==================== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== Scrollbar ==================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 16px 0; }
      .sidebar .logo h2, .sidebar .logo p, .sidebar a span { display: none; }
      .sidebar a { justify-content: center; padding: 12px; }
      .sidebar .logo { padding: 0 12px 16px; }
      .main { padding: 20px; }
      .modal { min-width: auto; margin: 16px; }
    }
    .range-btn {
      padding: 6px 18px; border: 1px solid var(--glass-border); border-radius: 20px;
      background: var(--glass-bg); color: var(--text-secondary); cursor: pointer;
      font-size: 13px; font-family: inherit; transition: all 0.2s; backdrop-filter: blur(10px);
    }
    .range-btn:hover { background: var(--glass-bg-hover); color: var(--text-primary); border-color: var(--glass-border-hover); }
    .range-btn.active { background: rgba(0, 212, 255, 0.12); color: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(0, 212, 255, 0.15); }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-gradient"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<!-- Login Page -->
<div id="loginPage" class="login-container">
  <div class="login-box">
    <h1>OpenClaw Router</h1>
    <p class="subtitle">AI Model Routing Gateway</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUsername" value="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn primary" onclick="doLogin()">Sign In</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- Main App -->
<div id="appPage" class="layout hidden">
  <div class="sidebar">
    <div class="logo">
      <h2>OpenClaw</h2>
      <p>Router</p>
    </div>
    <nav>
      <a href="#/dashboard" data-nav><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="#/users" data-nav><i data-lucide="users"></i><span>Users</span></a>
      <a href="#/keys" data-nav><i data-lucide="key-round"></i><span>API Keys</span></a>
      <a href="#/providers" data-nav><i data-lucide="plug"></i><span>Providers</span></a>
      <a href="#/models" data-nav><i data-lucide="boxes"></i><span>Models</span></a>
      <a href="#/routes" data-nav><i data-lucide="git-branch"></i><span>Routes</span></a>
      <a href="#/usage" data-nav><i data-lucide="bar-chart-3"></i><span>Usage Logs</span></a>
      <a href="#/billing" data-nav><i data-lucide="receipt"></i><span>Billing</span></a>
    </nav>
    <div class="logout-section">
      <a href="#" onclick="doLogout()"><i data-lucide="log-out"></i><span>Logout</span></a>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==================== State ====================
let token = null;
let admin = null;

// ==================== API ====================
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    credentials: 'same-origin',
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error('Unauthorized'); }
  return res.json();
}

const _cache = new Map();
async function cachedApi(url, ttlMs = 30000) {
  const hit = _cache.get(url);
  if (hit && Date.now() - hit.ts < ttlMs) return hit.data;
  const data = await api(url);
  _cache.set(url, { data, ts: Date.now() });
  return data;
}

// ==================== Auth ====================
async function doLogin() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await api('/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    if (data.success) { showApp(); location.hash = '#/dashboard'; }
    else { document.getElementById('loginError').textContent = data.error?.message || 'Login failed'; }
  } catch (e) { document.getElementById('loginError').textContent = 'Connection error'; }
}

function doLogout() {
  api('/admin/logout').finally(() => { showLogin(); location.hash = ''; });
}

function showLogin() {
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('appPage').classList.add('hidden');
}

function showApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// Check session on load
api('/admin/me').then(data => {
  if (data.admin) { admin = data.admin; showApp(); }
}).catch(() => {});

// Enter key for login
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ==================== Router ====================
window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', () => setTimeout(handleRoute, 100));

function handleRoute() {
  if (document.getElementById('appPage').classList.contains('hidden')) return;

  document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('active'));
  const hash = location.hash || '#/dashboard';
  document.querySelector(`[href="${hash}"]`)?.classList.add('active');

  const routes = {
    '#/dashboard': renderDashboard,
    '#/users': renderUsers,
    '#/keys': renderKeys,
    '#/providers': renderProviders,
    '#/models': renderModels,
    '#/routes': renderRoutes,
    '#/usage': renderUsage,
    '#/billing': renderBilling,
  };

  const handler = routes[hash];
  if (handler) handler();
  else document.getElementById('mainContent').innerHTML = '<div class="empty">Page not found</div>';
}

// ==================== Modal ====================
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ==================== Helpers ====================
function fmt$(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtNum(n) { return (n || 0).toLocaleString(); }
function esc(s) { return s ? String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
function statusBadge(active) { return `<span class="badge ${active ? 'active' : 'inactive'}">${active ? 'Active' : 'Inactive'}</span>`; }
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

// ==================== Pages ====================

function scrollToChart(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}

let dashboardRange = 'today';

async function renderDashboard() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';

  const [stats, chartData] = await Promise.all([
    cachedApi(`/admin/dashboard/stats?range=${dashboardRange}`),
    dashboardRange === 'today'
      ? cachedApi('/admin/dashboard/hourly-usage').then(r => r.hours)
      : cachedApi(`/admin/dashboard/daily-usage?days=${dashboardRange === '7d' ? 7 : 30}`).then(r => r.days),
  ]);

  const rangeLabel = { today: 'Today', '7d': '7 Days', '30d': '30 Days' }[dashboardRange];
  const rangeData = chartData;
  const isHourly = dashboardRange === 'today';

  c.innerHTML = `
    <div class="header"><h1>Dashboard</h1><div class="user-info">Admin: <span>${esc(admin?.username || '')}</span></div></div>
    <div class="cards">
      <div class="card glass" onclick="scrollToChart('chartRequests')"><div class="label">Requests (${rangeLabel})</div><div class="value green">${fmtNum(stats.range_requests)}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="scrollToChart('chartTokens')"><div class="label">Tokens (${rangeLabel})</div><div class="value purple">${fmtNum(stats.range_tokens || 0)}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="scrollToChart('chartCost')"><div class="label">Cost (${rangeLabel})</div><div class="value yellow">${stats.range_cost_usd}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="location.hash='#/users'"><div class="label">Total Users</div><div class="value blue">${stats.total_users}</div><div class="link-hint">Users &rarr;</div></div>
      <div class="card glass" onclick="location.hash='#/usage'"><div class="label">Total Requests</div><div class="value blue">${fmtNum(stats.total_requests)}</div><div class="link-hint">Usage logs &rarr;</div></div>
      <div class="card glass" onclick="location.hash='#/billing'"><div class="label">Total Cost</div><div class="value yellow">${stats.total_cost_usd}</div><div class="link-hint">Billing &rarr;</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;">
      <button class="range-btn ${dashboardRange === 'today' ? 'active' : ''}" onclick="dashboardRange='today';renderDashboard()">Today</button>
      <button class="range-btn ${dashboardRange === '7d' ? 'active' : ''}" onclick="dashboardRange='7d';renderDashboard()">7 Days</button>
      <button class="range-btn ${dashboardRange === '30d' ? 'active' : ''}" onclick="dashboardRange='30d';renderDashboard()">30 Days</button>
    </div>
    <div class="charts-grid">
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-blue);box-shadow:0 0 8px var(--accent-blue)"></span> Requests</div>
        <canvas id="chartRequests"></canvas>
      </div>
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-purple);box-shadow:0 0 8px var(--accent-purple)"></span> Tokens${isHourly ? '' : ' (K)'}</div>
        <canvas id="chartTokens"></canvas>
      </div>
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-yellow);box-shadow:0 0 8px var(--accent-yellow)"></span> Cost ($)</div>
        <canvas id="chartCost"></canvas>
      </div>
    </div>
  `;

  // Build chart data: fill missing hours for hourly view
  let chartData;
  let labels;
  if (isHourly) {
    const hourMap = {};
    rangeData.forEach(d => { hourMap[(d.hour || '').slice(11, 13)] = d; });
    chartData = Array.from({ length: 24 }, (_, i) => {
      const h = String(i).padStart(2, '0');
      const d = hourMap[h];
      return d || { requests: 0, tokens: 0, cost_cents: 0 };
    });
    labels = chartData.map((_, i) => String(i).padStart(2, '0') + ':00');
  } else {
    chartData = rangeData;
    labels = rangeData.map(d => (d.date || '').slice(5));
  }
  const gridColor = 'rgba(255,255,255,0.03)';
  const tickColor = '#6060a0';
  const borderColor = 'rgba(255,255,255,0.05)';
  const tickFont = { size: 10 };

  if (chartData.length > 0) {
    requestAnimationFrame(() => {
    // Requests chart
    new Chart(document.getElementById('chartRequests'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => d.requests),
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0, 212, 255, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#00d4ff',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });

    // Tokens chart
    new Chart(document.getElementById('chartTokens'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => isHourly ? (d.tokens || 0) : Math.round((d.tokens || 0) / 1000)),
          borderColor: '#b44dff',
          backgroundColor: 'rgba(180, 77, 255, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#b44dff',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });

    // Cost chart
    new Chart(document.getElementById('chartCost'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => (d.cost_cents / 100).toFixed(2)),
          borderColor: '#ffd000',
          backgroundColor: 'rgba(255, 208, 0, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#ffd000',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont, callback: v => '$' + v }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });
    });
  }
}

// ==================== Users ====================
async function renderUsers() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/users');

  c.innerHTML = `
    <div class="header"><h1>Users</h1><button class="btn primary" onclick="showCreateUserModal()"><i data-lucide="plus" style="width:16px;height:16px"></i> New User</button></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Name</th><th>Email</th><th>Balance</th><th>Keys</th><th>Status</th><th>Created</th><th>Actions</th></tr>
      ${data.users.map(u => `
        <tr>
          <td style="color:var(--text-primary);font-weight:500">${esc(u.name)}</td>
          <td>${esc(u.email) || '-'}</td>
          <td style="color:var(--accent-yellow)">${fmt$(u.balance_cents)}</td>
          <td>${u.active_keys || 0}</td>
          <td>${statusBadge(u.is_active)}</td>
          <td>${esc(u.created_at?.slice(0, 10))}</td>
          <td>
            <button class="btn sm" onclick="showTopUpModal('${u.id}', '${esc(u.name)}')">Top Up</button>
            <button class="btn sm" onclick="showCreateKeyModal('${u.id}')">+ Key</button>
          </td>
        </tr>
      `).join('')}
    </table>
    </div>
    ${data.users.length === 0 ? '<div class="empty">No users yet</div>' : ''}
  `;
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function showCreateUserModal() {
  openModal(`
    <h2>Create User</h2>
    <div class="field"><label>Name</label><input id="mUserName"></div>
    <div class="field"><label>Email</label><input id="mUserEmail"></div>
    <div class="field"><label>Initial Balance (cents)</label><input id="mUserBalance" type="number" value="1000"></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createUser()">Create</button></div>
  `);
}

async function createUser() {
  const name = document.getElementById('mUserName').value;
  const email = document.getElementById('mUserEmail').value || null;
  const balance_cents = parseInt(document.getElementById('mUserBalance').value) || 0;
  await api('/admin/users', { method: 'POST', body: JSON.stringify({ name, email, balance_cents }) });
  closeModal(); renderUsers();
}

function showTopUpModal(userId, userName) {
  openModal(`
    <h2>Top Up: ${userName}</h2>
    <div class="field"><label>Amount (cents, e.g. 1000 = $10.00)</label><input id="mTopUpAmount" type="number" value="1000"></div>
    <div class="field"><label>Description</label><input id="mTopUpDesc" value="Admin top-up"></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="doTopUp('${userId}')">Top Up</button></div>
  `);
}

async function doTopUp(userId) {
  const amount_cents = parseInt(document.getElementById('mTopUpAmount').value);
  const description = document.getElementById('mTopUpDesc').value;
  await api(`/admin/users/${userId}/topup`, { method: 'POST', body: JSON.stringify({ amount_cents, description }) });
  closeModal(); renderUsers();
}

function showCreateKeyModal(userId) {
  openModal(`
    <h2>Create API Key</h2>
    <div class="field"><label>Key Name</label><input id="mKeyName" value="default"></div>
    <div class="field"><label>Rate Limit (RPM)</label><input id="mKeyRpm" type="number" value="60"></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createKey('${userId}')">Create</button></div>
  `);
}

async function createKey(userId) {
  const name = document.getElementById('mKeyName').value;
  const rate_limit_rpm = parseInt(document.getElementById('mKeyRpm').value) || 60;
  const data = await api('/admin/api-keys', { method: 'POST', body: JSON.stringify({ user_id: userId, name, rate_limit_rpm }) });
  if (data.api_key) {
    openModal(`
      <h2>API Key Created</h2>
      <p style="color:var(--accent-yellow);font-size:13px;margin-bottom:16px;">Copy this key now. It cannot be shown again.</p>
      <div style="background:rgba(255,255,255,0.04);padding:14px 18px;border-radius:var(--radius-sm);font-family:'SF Mono','Fira Code',monospace;word-break:break-all;font-size:13px;color:var(--accent-blue);border:1px solid var(--glass-border)">${esc(data.api_key)}</div>
      <div class="actions"><button class="btn primary" onclick="copyToClipboard('${data.api_key}');closeModal()">Copy & Close</button></div>
    `);
  }
}

// ==================== API Keys ====================
async function renderKeys() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/api-keys');

  c.innerHTML = `
    <div class="header"><h1>API Keys</h1></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Prefix</th><th>User</th><th>Name</th><th>RPM</th><th>Last Used</th><th>Status</th><th>Created</th><th>Actions</th></tr>
      ${data.keys.map(k => `
        <tr>
          <td><code>${esc(k.key_prefix)}****</code></td>
          <td>${esc(k.user_name)}</td>
          <td style="color:var(--text-primary)">${esc(k.name)}</td>
          <td>${k.rate_limit_rpm}</td>
          <td>${esc(k.last_used_at?.slice(0, 16)) || '-'}</td>
          <td>${statusBadge(k.is_active)}</td>
          <td>${esc(k.created_at?.slice(0, 10))}</td>
          <td><button class="btn sm danger" onclick="revokeKey('${k.id}')">Revoke</button></td>
        </tr>
      `).join('')}
    </table>
    </div>
    ${data.keys.length === 0 ? '<div class="empty">No API keys yet</div>' : ''}
  `;
}

async function revokeKey(id) {
  if (!confirm('Revoke this API key?')) return;
  await api(`/admin/api-keys/${id}`, { method: 'DELETE' });
  renderKeys();
}

// ==================== Providers ====================
async function renderProviders() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/providers');

  c.innerHTML = `
    <div class="header"><h1>Providers</h1><button class="btn primary" onclick="showCreateProviderModal()"><i data-lucide="plus" style="width:16px;height:16px"></i> Add Provider</button></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Name</th><th>Type</th><th>Base URL</th><th>API Key</th><th>Priority</th><th>Timeout</th><th>Status</th><th>Actions</th></tr>
      ${data.providers.map(p => `
        <tr>
          <td style="color:var(--text-primary);font-weight:500">${esc(p.name)}</td>
          <td><code>${esc(p.type)}</code></td>
          <td style="max-width:200px;overflow:hidden;text-overflow:ellipsis;color:var(--text-muted);font-size:12px">${esc(p.base_url)}</td>
          <td>${esc(p.api_key_masked) || '<span style="color:var(--text-muted)">from env</span>'}</td>
          <td>${p.priority}</td>
          <td>${p.timeout_ms}ms</td>
          <td>${statusBadge(p.is_active)}</td>
          <td>
            <button class="btn sm" onclick="testProvider('${p.id}')">Test</button>
            <button class="btn sm" onclick="showEditProviderModal(${JSON.stringify(p).replace(/"/g, '&quot;')})">Edit</button>
            <button class="btn sm danger" onclick="deleteProvider('${p.id}')">Del</button>
          </td>
        </tr>
      `).join('')}
    </table>
    </div>
  `;
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

function showCreateProviderModal() {
  openModal(`
    <h2>Add Provider</h2>
    <div class="field"><label>Name</label><input id="mProvName" placeholder="e.g. openai"></div>
    <div class="field"><label>Type</label><select id="mProvType">
      <option value="openai">OpenAI</option><option value="anthropic">Anthropic</option>
      <option value="gemini">Gemini</option><option value="mistral">Mistral</option>
      <option value="openai-compatible">OpenAI-Compatible</option>
    </select></div>
    <div class="field"><label>Base URL</label><input id="mProvUrl" placeholder="https://api.openai.com/v1"></div>
    <div class="field"><label>API Key (optional, can use env)</label><input id="mProvKey" placeholder="sk-..."></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createProvider()">Add</button></div>
  `);
}

async function createProvider() {
  const name = document.getElementById('mProvName').value;
  const type = document.getElementById('mProvType').value;
  const base_url = document.getElementById('mProvUrl').value;
  const api_key = document.getElementById('mProvKey').value || null;
  await api('/admin/providers', { method: 'POST', body: JSON.stringify({ name, type, base_url, api_key }) });
  closeModal(); renderProviders();
}

function showEditProviderModal(p) {
  openModal(`
    <h2>Edit Provider: ${esc(p.name)}</h2>
    <div class="field"><label>Base URL</label><input id="mProvUrl" value="${esc(p.base_url)}"></div>
    <div class="field"><label>API Key</label><input id="mProvKey" value="${esc(p.api_key || '')}" placeholder="leave empty to keep current"></div>
    <div class="field"><label>Priority</label><input id="mProvPriority" type="number" value="${p.priority}"></div>
    <div class="field"><label>Timeout (ms)</label><input id="mProvTimeout" type="number" value="${p.timeout_ms}"></div>
    <div class="field"><label>Active</label><select id="mProvActive"><option value="1" ${p.is_active ? 'selected' : ''}>Yes</option><option value="0" ${!p.is_active ? 'selected' : ''}>No</option></select></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="updateProvider('${p.id}')">Save</button></div>
  `);
}

async function updateProvider(id) {
  const base_url = document.getElementById('mProvUrl').value;
  const api_key = document.getElementById('mProvKey').value || null;
  const priority = parseInt(document.getElementById('mProvPriority').value);
  const timeout_ms = parseInt(document.getElementById('mProvTimeout').value);
  const is_active = document.getElementById('mProvActive').value === '1';
  await api(`/admin/providers/${id}`, { method: 'PUT', body: JSON.stringify({ base_url, api_key, priority, timeout_ms, is_active }) });
  closeModal(); renderProviders();
}

async function testProvider(id) {
  const data = await api(`/admin/providers/${id}/test`, { method: 'POST' });
  alert(data.message);
}

async function deleteProvider(id) {
  if (!confirm('Delete this provider? Models using it will become unavailable.')) return;
  await api(`/admin/providers/${id}`, { method: 'DELETE' });
  renderProviders();
}

// ==================== Models ====================
async function renderModels() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/models');

  c.innerHTML = `
    <div class="header"><h1>Models</h1><button class="btn primary" onclick="showCreateModelModal()"><i data-lucide="plus" style="width:16px;height:16px"></i> Add Model</button></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Model ID</th><th>Display Name</th><th>Provider</th><th>Provider Model</th><th>Input $/1K</th><th>Output $/1K</th><th>Status</th><th>Actions</th></tr>
      ${data.models.map(m => `
        <tr>
          <td><code>${esc(m.model_id)}</code></td>
          <td style="color:var(--text-primary);font-weight:500">${esc(m.display_name)}</td>
          <td>${esc(m.provider_name)}</td>
          <td style="max-width:150px;overflow:hidden;color:var(--text-muted);font-size:12px">${esc(m.provider_model_id)}</td>
          <td>${m.input_price_per_1k}</td>
          <td>${m.output_price_per_1k}</td>
          <td>${statusBadge(m.is_active)}</td>
          <td>
            <button class="btn sm" onclick="showEditModelModal(${JSON.stringify(m).replace(/"/g, '&quot;')})">Edit</button>
            <button class="btn sm danger" onclick="deleteModel('${m.id}')">Del</button>
          </td>
        </tr>
      `).join('')}
    </table>
    </div>
  `;
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

async function showCreateModelModal() {
  const providers = await api('/admin/providers');
  openModal(`
    <h2>Add Model</h2>
    <div class="field"><label>Model ID (exposed to users)</label><input id="mModelId" placeholder="e.g. gpt-4o"></div>
    <div class="field"><label>Display Name</label><input id="mModelName"></div>
    <div class="field"><label>Provider</label><select id="mModelProvider">${providers.providers.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
    <div class="field"><label>Provider Model ID</label><input id="mModelProviderId"></div>
    <div class="field"><label>Input Price / 1K tokens ($)</label><input id="mModelInputPrice" type="number" step="0.0001" value="0"></div>
    <div class="field"><label>Output Price / 1K tokens ($)</label><input id="mModelOutputPrice" type="number" step="0.0001" value="0"></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createModel()">Add</button></div>
  `);
}

async function createModel() {
  const body = {
    model_id: document.getElementById('mModelId').value,
    display_name: document.getElementById('mModelName').value,
    provider_id: document.getElementById('mModelProvider').value,
    provider_model_id: document.getElementById('mModelProviderId').value,
    input_price_per_1k: parseFloat(document.getElementById('mModelInputPrice').value),
    output_price_per_1k: parseFloat(document.getElementById('mModelOutputPrice').value),
  };
  await api('/admin/models', { method: 'POST', body: JSON.stringify(body) });
  closeModal(); renderModels();
}

function showEditModelModal(m) {
  openModal(`
    <h2>Edit Model: ${esc(m.model_id)}</h2>
    <div class="field"><label>Display Name</label><input id="mModelName" value="${esc(m.display_name)}"></div>
    <div class="field"><label>Input Price / 1K tokens ($)</label><input id="mModelInputPrice" type="number" step="0.0001" value="${m.input_price_per_1k}"></div>
    <div class="field"><label>Output Price / 1K tokens ($)</label><input id="mModelOutputPrice" type="number" step="0.0001" value="${m.output_price_per_1k}"></div>
    <div class="field"><label>Active</label><select id="mModelActive"><option value="1" ${m.is_active ? 'selected' : ''}>Yes</option><option value="0" ${!m.is_active ? 'selected' : ''}>No</option></select></div>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="updateModel('${m.id}')">Save</button></div>
  `);
}

async function updateModel(id) {
  const body = {
    display_name: document.getElementById('mModelName').value,
    input_price_per_1k: parseFloat(document.getElementById('mModelInputPrice').value),
    output_price_per_1k: parseFloat(document.getElementById('mModelOutputPrice').value),
    is_active: document.getElementById('mModelActive').value === '1',
  };
  await api(`/admin/models/${id}`, { method: 'PUT', body: JSON.stringify(body) });
  closeModal(); renderModels();
}

async function deleteModel(id) {
  if (!confirm('Delete this model?')) return;
  await api(`/admin/models/${id}`, { method: 'DELETE' });
  renderModels();
}

// ==================== Routes ====================
async function renderRoutes() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/routes');

  c.innerHTML = `
    <div class="header"><h1>Routes</h1><button class="btn primary" onclick="showCreateRouteModal()"><i data-lucide="plus" style="width:16px;height:16px"></i> New Route</button></div>
    <p style="color:var(--text-muted);font-size:13px;margin-bottom:20px;">Routes define multi-provider fallback chains for a model.</p>
    ${data.routes.map(r => `
      <div class="card glass-static" style="margin-bottom:16px;padding:20px">
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:14px">
          <code style="font-size:15px;font-weight:600;background:none;padding:0;color:var(--accent-blue)">${esc(r.model_id)}</code>
          <div style="display:flex;align-items:center;gap:10px">
            ${statusBadge(r.is_active)}
            <button class="btn sm danger" onclick="deleteRoute('${r.id}')">Delete</button>
          </div>
        </div>
        <div style="display:flex;gap:10px;flex-wrap:wrap;">
          ${r.entries.map((e, i) => `
            <div class="route-entry">
              <span class="tag ${i === 0 ? 'primary' : 'fallback'}">${i === 0 ? 'Primary' : 'Fallback ' + i}</span>
              <span style="color:var(--text-muted)">&rarr;</span>
              <span>${esc(e.provider_name)}</span>
              <span style="color:var(--text-muted)">/</span>
              <span style="color:var(--text-primary)">${esc(e.provider_model_id)}</span>
            </div>
          `).join('')}
        </div>
      </div>
    `).join('')}
    ${data.routes.length === 0 ? '<div class="empty">No routes configured. Models will use their single provider.</div>' : ''}
  `;
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

async function showCreateRouteModal() {
  const providers = await api('/admin/providers');
  openModal(`
    <h2>Create Route</h2>
    <div class="field"><label>Model ID (virtual model name)</label><input id="mRouteModel" placeholder="e.g. gpt-4o"></div>
    <p style="color:var(--text-muted);font-size:12px;margin-bottom:12px;">Add entries in priority order (first = primary):</p>
    <div id="routeEntries">
      <div class="field" style="display:flex;gap:8px;align-items:end;">
        <div style="flex:1"><label>Provider</label><select class="route-provider">${providers.providers.map(p => `<option value="${p.id}">${esc(p.name)}</option>`).join('')}</select></div>
        <div style="flex:1"><label>Provider Model ID</label><input class="route-model-id"></div>
      </div>
    </div>
    <button class="btn sm" onclick="addRouteEntry()" style="margin:12px 0">+ Add Entry</button>
    <div class="actions"><button class="btn" onclick="closeModal()">Cancel</button><button class="btn primary" onclick="createRoute()">Create</button></div>
  `);
}

function addRouteEntry() {
  const providers = document.querySelectorAll('.route-provider');
  const options = providers[0]?.innerHTML || '';
  const div = document.createElement('div');
  div.className = 'field';
  div.style.cssText = 'display:flex;gap:8px;align-items:end;';
  div.innerHTML = `<div style="flex:1"><label>Provider</label><select class="route-provider">${options}</select></div><div style="flex:1"><label>Provider Model ID</label><input class="route-model-id"></div><button class="btn sm danger" onclick="this.parentElement.remove()">-</button>`;
  document.getElementById('routeEntries').appendChild(div);
}

async function createRoute() {
  const model_id = document.getElementById('mRouteModel').value;
  const providerSelects = document.querySelectorAll('.route-provider');
  const modelInputs = document.querySelectorAll('.route-model-id');
  const entries = Array.from(providerSelects).map((sel, i) => ({
    provider_id: sel.value,
    provider_model_id: modelInputs[i].value,
  })).filter(e => e.provider_model_id);

  await api('/admin/routes', { method: 'POST', body: JSON.stringify({ model_id, entries }) });
  closeModal(); renderRoutes();
}

async function deleteRoute(id) {
  if (!confirm('Delete this route?')) return;
  await api(`/admin/routes/${id}`, { method: 'DELETE' });
  renderRoutes();
}

// ==================== Usage Logs ====================
async function renderUsage() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const data = await api('/admin/usage');

  c.innerHTML = `
    <div class="header"><h1>Usage Logs</h1></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Time</th><th>User</th><th>Model</th><th>Provider</th><th>Tokens</th><th>Cost</th><th>Latency</th><th>Status</th></tr>
      ${data.logs.map(l => `
        <tr>
          <td style="white-space:nowrap;font-size:12px">${esc(l.created_at?.slice(0, 19))}</td>
          <td style="color:var(--text-primary)">${esc(l.user_name)}</td>
          <td><code>${esc(l.model_id)}</code></td>
          <td>${esc(l.provider_name)}</td>
          <td>${fmtNum(l.total_tokens)}</td>
          <td style="color:var(--accent-yellow)">${fmt$(l.cost_cents)}</td>
          <td>${l.latency_ms ? l.latency_ms + 'ms' : '-'}</td>
          <td><span class="badge ${l.status}">${l.status}</span></td>
        </tr>
      `).join('')}
    </table>
    </div>
    ${data.logs.length === 0 ? '<div class="empty">No usage logs yet</div>' : ''}
  `;
}

async function renderBilling() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';

  c.innerHTML = `
    <div class="header"><h1>Billing / Transactions</h1></div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Time</th><th>User</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th></tr>
      ${data.transactions.map(t => `
        <tr>
          <td style="white-space:nowrap;font-size:12px">${esc(t.created_at?.slice(0, 19))}</td>
          <td style="color:var(--text-primary)">${esc(t.user_name)}</td>
          <td><span class="badge ${t.type === 'topup' ? 'success' : ''}">${t.type}</span></td>
          <td style="color:${t.amount_cents > 0 ? 'var(--accent-green)' : 'var(--accent-red)'};font-weight:500">${t.amount_cents > 0 ? '+' : ''}${fmt$(t.amount_cents)}</td>
          <td style="color:var(--accent-yellow)">${fmt$(t.balance_after_cents)}</td>
