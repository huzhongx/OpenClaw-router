<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenClaw Router</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><text y='28' font-size='28'>🦀</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=Outfit:wght@300;500;700&display=swap" rel="stylesheet">
  <script defer src="https://unpkg.com/lucide@latest"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/chart.js@4.4.7/dist/chart.umd.min.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
  <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
  <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/en.js"></script>
  <style>
    .flatpickr-calendar { background: rgba(18,18,42,0.95) !important; border: 1px solid var(--glass-border) !important; box-shadow: 0 12px 40px rgba(0,0,0,0.5) !important; border-radius: var(--radius-sm) !important; }
    [data-theme="light"] .flatpickr-calendar { background: rgba(255,255,255,0.95) !important; box-shadow: 0 12px 40px rgba(0,0,0,0.12) !important; }
    .flatpickr-months, .flatpickr-current-month .flatpickr-monthDropdown-months, .flatpickr-current-month input.cur-year { color: var(--text-primary) !important; background: transparent !important; }
    .flatpickr-monthDropdown-months option, .flatpickr-monthDropdown-months optgroup { background: var(--bg-secondary) !important; color: var(--text-primary) !important; }
    .flatpickr-weekday { color: var(--text-muted) !important; }
    .flatpickr-day { color: var(--text-secondary) !important; border-radius: 6px !important; }
    .flatpickr-day:hover { background: rgba(255,255,255,0.08) !important; color: var(--text-primary) !important; }
    .flatpickr-day.selected { background: var(--accent-blue) !important; color: #000 !important; border-color: var(--accent-blue) !important; }
    .flatpickr-day.today { border-color: var(--accent-purple) !important; }
    .flatpickr-day.prevMonthDay, .flatpickr-day.nextMonthDay { color: var(--text-muted) !important; opacity: 0.4; }
    .spanContainer.flatpickr { position: relative; display: inline-block; }
    .spanContainer.flatpickr input { cursor: pointer; }
  </style>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    :root {
      --bg-primary: #0a0a1a;
      --bg-secondary: #12122a;
      --glass-bg: rgba(255, 255, 255, 0.04);
      --glass-bg-hover: rgba(255, 255, 255, 0.08);
      --glass-bg-strong: rgba(255, 255, 255, 0.06);
      --glass-border: rgba(255, 255, 255, 0.08);
      --glass-border-hover: rgba(255, 255, 255, 0.15);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.4);
      --text-primary: #e8e8f0;
      --text-secondary: #9090b0;
      --text-muted: #6060a0;
      --accent-blue: #00d4ff;
      --accent-purple: #b44dff;
      --accent-green: #00ffaa;
      --accent-red: #ff4d6a;
      --accent-yellow: #ffd000;
      --blur: 20px;
      --radius: 16px;
      --radius-sm: 10px;
    }
    [data-theme="light"] {
      --bg-primary: #f0f2f5;
      --bg-secondary: #e4e7ec;
      --glass-bg: rgba(255, 255, 255, 0.7);
      --glass-bg-hover: rgba(255, 255, 255, 0.85);
      --glass-bg-strong: rgba(255, 255, 255, 0.6);
      --glass-border: rgba(0, 0, 0, 0.08);
      --glass-border-hover: rgba(0, 0, 0, 0.15);
      --glass-shadow: 0 8px 32px rgba(0, 0, 0, 0.08);
      --glass-shadow-hover: 0 12px 40px rgba(0, 0, 0, 0.12);
      --text-primary: #1a1a2e;
      --text-secondary: #4a4a6a;
      --text-muted: #8888a8;
      --blur: 20px;
    }
    body {
      font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg-primary);
      color: var(--text-primary);
      min-height: 100vh;
      overflow-x: hidden;
    }
    h1, h2, h3 { font-family: 'Outfit', sans-serif; }
    a { color: var(--accent-blue); text-decoration: none; }

    /* ==================== Animated Background ==================== */
    .bg-gradient {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(135deg, #0a0a1a 0%, #1a0a2e 40%, #0a1a2e 70%, #0a0a1a 100%);
      z-index: -2;
    }
    [data-theme="light"] .bg-gradient {
      background: linear-gradient(135deg, #e8ecf1 0%, #e0e4f0 40%, #e4e8f0 70%, #eaecf0 100%);
    }
    .bg-orb {
      position: fixed; border-radius: 50%; filter: blur(80px); opacity: 0.35; z-index: -1;
      pointer-events: none; will-change: transform;
    }
    [data-theme="light"] .bg-orb { opacity: 0.15; }
    .bg-orb-1 {
      width: 500px; height: 500px; top: -10%; left: -5%;
      background: radial-gradient(circle, var(--accent-purple), transparent 70%);
      animation: float1 20s ease-in-out infinite;
    }
    .bg-orb-2 {
      width: 400px; height: 400px; top: 50%; right: -8%;
      background: radial-gradient(circle, var(--accent-blue), transparent 70%);
      animation: float2 25s ease-in-out infinite;
    }
    .bg-orb-3 {
      width: 350px; height: 350px; bottom: -5%; left: 30%;
      background: radial-gradient(circle, #1a3a6a, transparent 70%);
      animation: float3 22s ease-in-out infinite;
    }
    @keyframes float1 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(80px, 60px); } }
    @keyframes float2 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(-60px, -80px); } }
    @keyframes float3 { 0%,100% { transform: translate(0,0); } 50% { transform: translate(40px, -50px); } }
    @media (prefers-reduced-motion: reduce) {
      .bg-orb { animation: none !important; }
    }

    /* ==================== Glass Components ==================== */
    .glass {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
      transition: background 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s cubic-bezier(0.4, 0, 0.2, 1), box-shadow 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .glass:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: var(--glass-shadow-hover);
    }
    .glass-static {
      background: var(--glass-bg);
      backdrop-filter: blur(var(--blur));
      -webkit-backdrop-filter: blur(var(--blur));
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: var(--glass-shadow);
    }

    /* ==================== Layout ==================== */
    .layout { display: flex; min-height: 100vh; }

    /* ==================== Sidebar ==================== */
    .sidebar {
      width: 240px; flex-shrink: 0; padding: 24px 0;
      background: rgba(10, 10, 26, 0.6);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border-right: 1px solid var(--glass-border);
      display: flex; flex-direction: column;
    }
    [data-theme="light"] .sidebar { background: rgba(255, 255, 255, 0.6); }
    .sidebar .logo {
      padding: 0 24px 24px; margin-bottom: 8px;
      border-bottom: 1px solid var(--glass-border);
    }
    .sidebar .logo h2 {
      font-family: 'Outfit', sans-serif;
      font-weight: 700; font-size: 20px;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .sidebar .logo p {
      font-size: 11px; color: var(--text-muted); margin-top: 4px; letter-spacing: 1px; text-transform: uppercase;
    }
    .sidebar nav { flex: 1; padding: 8px 12px; }
    .sidebar a {
      display: flex; align-items: center; gap: 12px;
      padding: 10px 16px; border-radius: var(--radius-sm);
      color: var(--text-secondary); font-size: 14px; font-weight: 500;
      transition: all 0.2s ease; position: relative;
      margin-bottom: 2px;
    }
    .sidebar a:hover {
      color: var(--text-primary);
      background: rgba(255,255,255,0.04);
    }
    [data-theme="light"] .sidebar a:hover { background: rgba(0,0,0,0.04); }
    .sidebar a.active {
      color: var(--accent-blue);
      background: rgba(0, 212, 255, 0.08);
      box-shadow: inset 3px 0 0 var(--accent-blue);
    }
    [data-theme="light"] .sidebar a.active { background: rgba(0, 150, 220, 0.08); }
    .sidebar a.active i { color: var(--accent-blue); }
    .sidebar a i { width: 18px; height: 18px; opacity: 0.7; transition: opacity 0.2s; }
    .sidebar a:hover i { opacity: 1; }
    .sidebar .logout-section { padding: 12px; }
    .sidebar .logout-section a {
      color: var(--accent-red); opacity: 0.7;
    }
    .sidebar .logout-section a:hover { opacity: 1; }

    /* ==================== Main Content ==================== */
    .main {
      flex: 1; padding: 32px; overflow-y: auto; max-height: 100vh;
    }
    .header {
      display: flex; justify-content: space-between; align-items: center;
      margin-bottom: 28px;
      animation: fadeIn 0.4s ease;
    }
    .header h1 { font-size: 26px; font-weight: 700; color: var(--text-primary); }
    .header .user-info { font-size: 13px; color: var(--text-muted); }
    .header .user-info span { color: var(--text-secondary); }

    /* ==================== Cards Grid ==================== */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px; margin-bottom: 28px;
    }
    .card {
      padding: 24px; cursor: pointer;
      animation: slideUp 0.5s ease both;
    }
    .card:active { transform: translateY(-1px) scale(0.98); }
    .card .link-hint {
      font-size: 10px; color: var(--text-muted); margin-top: 6px;
      opacity: 0; transition: opacity 0.2s;
    }
    .card:hover .link-hint { opacity: 1; }
    .card:nth-child(1) { animation-delay: 0s; }
    .card:nth-child(2) { animation-delay: 0.05s; }
    .card:nth-child(3) { animation-delay: 0.1s; }
    .card:nth-child(4) { animation-delay: 0.15s; }
    .card:nth-child(5) { animation-delay: 0.2s; }
    .card:nth-child(6) { animation-delay: 0.25s; }
    .card:hover { transform: translateY(-3px); }
    .card .label {
      font-size: 11px; color: var(--text-muted); text-transform: uppercase;
      letter-spacing: 1px; margin-bottom: 10px; font-weight: 500;
    }
    .card .value {
      font-family: 'Outfit', sans-serif;
      font-size: 30px; font-weight: 700;
    }
    .card .value.green { background: linear-gradient(135deg, var(--accent-green), #00cc88); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.yellow { background: linear-gradient(135deg, var(--accent-yellow), #ffaa00); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.blue { background: linear-gradient(135deg, var(--accent-blue), #0088cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    .card .value.purple { background: linear-gradient(135deg, var(--accent-purple), #8833cc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
    [data-theme="light"] .card .value.green { color: #00aa66; -webkit-text-fill-color: #00aa66; background: none; }
    [data-theme="light"] .card .value.yellow { color: #cc8800; -webkit-text-fill-color: #cc8800; background: none; }
    [data-theme="light"] .card .value.blue { color: #0066aa; -webkit-text-fill-color: #0066aa; background: none; }
    [data-theme="light"] .card .value.purple { color: #6622aa; -webkit-text-fill-color: #6622aa; background: none; }

    /* ==================== Table ==================== */
    .table-wrap {
      animation: fadeIn 0.5s ease 0.1s both;
    }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    th {
      text-align: left; padding: 12px 16px;
      color: var(--text-muted); font-weight: 500; font-size: 11px;
      text-transform: uppercase; letter-spacing: 0.5px;
      background: rgba(255,255,255,0.02);
      border-bottom: 1px solid var(--glass-border);
    }
    td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255,255,255,0.03);
      color: var(--text-secondary);
    }
    tr:hover td { background: rgba(255,255,255,0.02); }
    [data-theme="light"] tr:hover td { background: rgba(0,0,0,0.03); }
    code {
      font-family: 'SF Mono', 'Fira Code', monospace;
      background: rgba(255,255,255,0.06);
      padding: 2px 8px; border-radius: 6px; font-size: 12px;
      color: var(--accent-blue);
    }
    [data-theme="light"] code { background: rgba(0,0,0,0.06); }

    /* ==================== Buttons ==================== */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 9px 18px; border-radius: var(--radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg); color: var(--text-primary);
      cursor: pointer; font-size: 13px; font-weight: 500;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
      backdrop-filter: blur(10px);
    }
    .btn:hover {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
      box-shadow: 0 4px 16px rgba(0,0,0,0.2);
      transform: translateY(-1px);
    }
    .btn.primary {
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      border: none; color: #fff;
      box-shadow: 0 4px 20px rgba(0, 212, 255, 0.2);
    }
    .btn.primary:hover {
      box-shadow: 0 6px 28px rgba(0, 212, 255, 0.35);
      transform: translateY(-2px);
    }
    .btn.danger {
      border-color: rgba(255, 77, 106, 0.3); color: var(--accent-red);
    }
    .btn.danger:hover {
      background: rgba(255, 77, 106, 0.1);
      border-color: var(--accent-red);
      box-shadow: 0 4px 16px rgba(255, 77, 106, 0.15);
    }
    .btn.sm { padding: 5px 12px; font-size: 12px; }

    /* ==================== Form / Modal ==================== */
    .modal-overlay {
      display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      z-index: 100; justify-content: center; align-items: center;
    }
    .modal-overlay.active { display: flex; }
    .modal {
      background: rgba(18, 18, 42, 0.85);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      padding: 32px; min-width: 420px; max-width: 600px;
      box-shadow: 0 24px 64px rgba(0,0,0,0.5);
      animation: modalIn 0.3s ease;
    }
    [data-theme="light"] .modal { background: rgba(255,255,255,0.9); box-shadow: 0 24px 64px rgba(0,0,0,0.12); }
    @keyframes modalIn {
      from { opacity: 0; transform: scale(0.95) translateY(10px); }
      to { opacity: 1; transform: scale(1) translateY(0); }
    }
    .modal h2 {
      margin-bottom: 20px; font-size: 20px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .modal .field { margin-bottom: 16px; }
    .modal label {
      display: block; font-size: 12px; color: var(--text-muted);
      margin-bottom: 6px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .modal input, .modal select, .modal textarea {
      width: 100%; padding: 10px 14px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 14px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }
    [data-theme="light"] .modal input, [data-theme="light"] .modal select, [data-theme="light"] .modal textarea {
      background: rgba(0,0,0,0.03);
    }
    .modal input:focus, .modal select:focus, .modal textarea:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
      background: rgba(255,255,255,0.06);
    }
    .modal select option { background: var(--bg-secondary); }
    .modal .actions {
      margin-top: 24px; display: flex; gap: 10px; justify-content: flex-end;
    }

    /* ==================== Badges ==================== */
    .badge {
      display: inline-flex; align-items: center; gap: 5px;
      padding: 3px 10px; border-radius: 20px; font-size: 11px; font-weight: 500;
    }
    .badge::before {
      content: ''; width: 6px; height: 6px; border-radius: 50%;
    }
    .badge.active { background: rgba(0, 255, 170, 0.08); color: var(--accent-green); }
    .badge.active::before { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .badge.inactive { background: rgba(255, 77, 106, 0.08); color: var(--accent-red); }
    .badge.inactive::before { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }
    .badge.success { background: rgba(0, 255, 170, 0.08); color: var(--accent-green); }
    .badge.success::before { background: var(--accent-green); box-shadow: 0 0 6px var(--accent-green); }
    .badge.error { background: rgba(255, 77, 106, 0.08); color: var(--accent-red); }
    .badge.error::before { background: var(--accent-red); box-shadow: 0 0 6px var(--accent-red); }

    /* ==================== Chart ==================== */
    .charts-grid {
      display: flex; flex-direction: column; gap: 16px;
      margin-bottom: 28px;
    }
    .chart-card {
      padding: 20px; animation: slideUp 0.5s ease both;
      transition: border-color 0.4s ease, box-shadow 0.4s ease;
    }
    .chart-card.highlight {
      border-color: rgba(255,255,255,0.2);
      box-shadow: 0 8px 40px rgba(0,0,0,0.4);
    }
    .chart-card:nth-child(1) { animation-delay: 0.1s; }
    .chart-card:nth-child(2) { animation-delay: 0.15s; }
    .chart-card:nth-child(3) { animation-delay: 0.2s; }
    .chart-card .chart-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13px; font-weight: 500; color: var(--text-muted);
      text-transform: uppercase; letter-spacing: 0.5px;
      margin-bottom: 16px; display: flex; align-items: center; gap: 8px;
    }
    .chart-card .chart-title .dot {
      width: 8px; height: 8px; border-radius: 50%;
    }
    .chart-card canvas { width: 100% !important; height: 200px !important; }
    .charts-row {
      display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 16px; margin-bottom: 28px;
    }
    @media (max-width: 900px) { .charts-row { grid-template-columns: 1fr; } }
    .rank-badge {
      display: inline-flex; align-items: center; justify-content: center;
      width: 26px; height: 26px; border-radius: 50%; font-size: 12px; font-weight: 700;
    }
    .rank-1 { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #1a1a00; }
    .rank-2 { background: linear-gradient(135deg, #c0c0c0, #a0a0a0); color: #1a1a1a; }
    .rank-3 { background: linear-gradient(135deg, #cd7f32, #a0612b); color: #1a1000; }
    .section-title {
      font-family: 'Outfit', sans-serif; font-size: 16px; font-weight: 600;
      color: var(--text-primary); margin-bottom: 16px;
      display: flex; align-items: center; gap: 8px;
    }
    .section-title i { color: var(--accent-blue); }

    /* ==================== Pagination ==================== */
    .pagination {
      margin-top: 20px; display: flex; gap: 8px;
      align-items: center; font-size: 13px; color: var(--text-muted);
    }
    .pagination button {
      padding: 6px 12px; background: var(--glass-bg);
      border: 1px solid var(--glass-border); border-radius: 8px;
      color: var(--text-primary); cursor: pointer;
      transition: all 0.2s;
    }
    .pagination button:hover:not(:disabled) {
      background: var(--glass-bg-hover);
      border-color: var(--glass-border-hover);
    }
    .pagination button:disabled { opacity: 0.3; cursor: not-allowed; }

    /* ==================== Login ==================== */
    .login-container {
      display: flex; justify-content: center; align-items: center;
      min-height: 100vh;
    }
    .login-box {
      width: 400px; padding: 48px;
      background: rgba(18, 18, 42, 0.6);
      backdrop-filter: blur(30px);
      -webkit-backdrop-filter: blur(30px);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius);
      box-shadow: 0 24px 64px rgba(0,0,0,0.4);
      animation: modalIn 0.5s ease;
    }
    [data-theme="light"] .login-box { background: rgba(255,255,255,0.8); box-shadow: 0 24px 64px rgba(0,0,0,0.1); }
    .login-box h1 {
      text-align: center; margin-bottom: 8px; font-size: 28px; font-weight: 700;
      background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .login-box .subtitle {
      text-align: center; color: var(--text-muted); font-size: 13px;
      margin-bottom: 32px;
    }
    .login-box .field { margin-bottom: 20px; }
    .login-box label {
      display: block; font-size: 12px; color: var(--text-muted);
      margin-bottom: 8px; font-weight: 500; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .login-box input {
      width: 100%; padding: 12px 16px;
      background: rgba(255,255,255,0.04);
      border: 1px solid var(--glass-border);
      border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 15px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s ease;
    }
    [data-theme="light"] .login-box input { background: rgba(0,0,0,0.03); }
    .login-box input:focus {
      outline: none;
      border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .login-box .btn { width: 100%; padding: 12px; justify-content: center; font-size: 14px; margin-top: 8px; }
    .login-box .error { color: var(--accent-red); font-size: 13px; margin-top: 12px; text-align: center; }

    /* ==================== Utility ==================== */
    .hidden { display: none !important; }
    .toolbar {
      display: flex; gap: 10px; margin-bottom: 20px;
      align-items: center; flex-wrap: wrap;
    }
    .toolbar input, .toolbar select {
      padding: 8px 14px; background: var(--glass-bg);
      border: 1px solid var(--glass-border); border-radius: var(--radius-sm);
      color: var(--text-primary); font-size: 13px;
      font-family: 'DM Sans', sans-serif;
      transition: all 0.2s;
    }
    [data-theme="light"] .toolbar input, [data-theme="light"] .toolbar select { background: rgba(255,255,255,0.8); }
    .toolbar input[type="date" lang="en"]::-webkit-calendar-picker-indicator { filter: invert(0.7); cursor: pointer; }
    .toolbar input:focus, .toolbar select:focus {
      outline: none; border-color: var(--accent-blue);
      box-shadow: 0 0 0 3px rgba(0, 212, 255, 0.1);
    }
    .empty {
      text-align: center; color: var(--text-muted); padding: 60px 20px;
      font-size: 14px;
    }

    /* ==================== Route Card ==================== */
    .route-entry {
      display: inline-flex; align-items: center; gap: 8px;
      background: rgba(255,255,255,0.03);
      padding: 6px 14px; border-radius: 8px;
      font-size: 12px; color: var(--text-secondary);
      border: 1px solid rgba(255,255,255,0.04);
    }
    [data-theme="light"] .route-entry { background: rgba(0,0,0,0.03); border-color: rgba(0,0,0,0.06); }
    .route-entry .tag {
      font-weight: 600; font-size: 10px; text-transform: uppercase;
      letter-spacing: 0.5px;
    }
    .route-entry .tag.primary { color: var(--accent-green); }
    .route-entry .tag.fallback { color: var(--text-muted); }

    /* ==================== Animations ==================== */
    @keyframes fadeIn {
      from { opacity: 0; }
      to { opacity: 1; }
    }
    @keyframes slideUp {
      from { opacity: 0; transform: translateY(16px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* ==================== Scrollbar ==================== */
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.08); border-radius: 3px; }
    ::-webkit-scrollbar-thumb:hover { background: rgba(255,255,255,0.15); }
    [data-theme="light"] ::-webkit-scrollbar-thumb { background: rgba(0,0,0,0.12); }
    [data-theme="light"] ::-webkit-scrollbar-thumb:hover { background: rgba(0,0,0,0.2); }

    /* ==================== Responsive ==================== */
    @media (max-width: 768px) {
      .sidebar { width: 60px; padding: 16px 0; }
      .sidebar .logo h2, .sidebar .logo p, .sidebar a span { display: none; }
      .sidebar a { justify-content: center; padding: 12px; }
      .sidebar .logo { padding: 0 12px 16px; }
      .main { padding: 20px; }
      .modal { min-width: auto; margin: 16px; }
    }
    .range-btn {
      padding: 6px 18px; border: 1px solid var(--glass-border); border-radius: 20px;
      background: var(--glass-bg); color: var(--text-secondary); cursor: pointer;
      font-size: 13px; font-family: inherit; transition: all 0.2s; backdrop-filter: blur(10px);
    }
    .range-btn:hover { background: var(--glass-bg-hover); color: var(--text-primary); border-color: var(--glass-border-hover); }
    .range-btn.active { background: rgba(0, 212, 255, 0.12); color: var(--accent-blue); border-color: var(--accent-blue); box-shadow: 0 0 12px rgba(0, 212, 255, 0.15); }
  </style>
</head>
<body>

<!-- Background -->
<div class="bg-gradient"></div>
<div class="bg-orb bg-orb-1"></div>
<div class="bg-orb bg-orb-2"></div>
<div class="bg-orb bg-orb-3"></div>

<!-- Login Page -->
<div id="loginPage" class="login-container">
  <div class="login-box">
    <h1>OpenClaw Router</h1>
    <p class="subtitle">AI Model Routing Gateway</p>
    <div class="field">
      <label>Username</label>
      <input type="text" id="loginUsername" value="admin" autocomplete="username">
    </div>
    <div class="field">
      <label>Password</label>
      <input type="password" id="loginPassword" autocomplete="current-password">
    </div>
    <button class="btn primary" onclick="doLogin()">Sign In</button>
    <div class="error" id="loginError"></div>
  </div>
</div>

<!-- Main App -->
<div id="appPage" class="layout hidden">
  <div class="sidebar">
    <div class="logo">
      <h2>OpenClaw</h2>
      <p>Router</p>
    </div>
    <nav>
      <a href="#/dashboard" data-nav><i data-lucide="layout-dashboard"></i><span>Dashboard</span></a>
      <a href="#/users" data-nav><i data-lucide="users"></i><span>Users</span></a>
      <a href="#/keys" data-nav><i data-lucide="key-round"></i><span>API Keys</span></a>
      <a href="#/providers" data-nav><i data-lucide="plug"></i><span>Providers</span></a>
      <a href="#/models" data-nav><i data-lucide="boxes"></i><span>Models</span></a>
      <a href="#/routes" data-nav><i data-lucide="git-branch"></i><span>Routes</span></a>
      <a href="#/usage" data-nav><i data-lucide="bar-chart-3"></i><span>Usage Logs</span></a>
      <a href="#/billing" data-nav><i data-lucide="receipt"></i><span>Billing</span></a>
    </nav>
    <div class="logout-section">
      <a href="#" onclick="doLogout()"><i data-lucide="log-out"></i><span>Logout</span></a>
    </div>
  </div>
  <div class="main" id="mainContent"></div>
</div>

<!-- Modal -->
<div class="modal-overlay" id="modalOverlay">
  <div class="modal" id="modalContent"></div>
</div>

<script>
// ==================== State ====================
let token = null;
let admin = null;

// ==================== API ====================
async function api(path, opts = {}) {
  const res = await fetch(path, {
    headers: { 'Content-Type': 'application/json', ...opts.headers },
    credentials: 'same-origin',
    ...opts,
  });
  if (res.status === 401) { showLogin(); throw new Error('Unauthorized'); }
  return res.json();
}

const _cache = new Map();
async function cachedApi(url, ttlMs = 30000) {
  const hit = _cache.get(url);
  if (hit && Date.now() - hit.ts < ttlMs) return hit.data;
  const data = await api(url);
  _cache.set(url, { data, ts: Date.now() });
  return data;
}

// ==================== Theme ====================
function getTheme() { return localStorage.getItem('theme') || 'dark'; }
function applyTheme(theme) {
  document.documentElement.dataset.theme = theme;
  const icon = document.getElementById('themeIcon');
  if (icon) { icon.setAttribute('data-lucide', theme === 'dark' ? 'sun' : 'moon'); if (typeof lucide !== 'undefined') lucide.createIcons(); }
}
function toggleTheme() {
  const next = getTheme() === 'dark' ? 'light' : 'dark';
  localStorage.setItem('theme', next);
  applyTheme(next);
}
applyTheme(getTheme());

// ==================== Auth ====================
async function doLogin() {
  const username = document.getElementById('loginUsername').value;
  const password = document.getElementById('loginPassword').value;
  try {
    const data = await api('/admin/login', {
      method: 'POST',
      body: JSON.stringify({ username, password }),
    });
    if (data.success) { showApp(); location.hash = '#/dashboard'; }
    else { document.getElementById('loginError').textContent = data.error?.message || 'Login failed'; }
  } catch (e) { document.getElementById('loginError').textContent = 'Connection error'; }
}

function doLogout() {
  api('/admin/logout').finally(() => { showLogin(); location.hash = ''; });
}

function showLogin() {
  document.getElementById('loginPage').classList.remove('hidden');
  document.getElementById('appPage').classList.add('hidden');
}

function showApp() {
  document.getElementById('loginPage').classList.add('hidden');
  document.getElementById('appPage').classList.remove('hidden');
  // Inject theme toggle button if not exists
  if (!document.getElementById('themeToggle')) {
    const btn = document.createElement('a');
    btn.id = 'themeToggle';
    btn.href = '#';
    btn.title = 'Toggle theme';
    btn.onclick = (e) => { e.preventDefault(); toggleTheme(); };
    btn.style.cssText = 'position:fixed;bottom:20px;left:20px;z-index:50;padding:10px;border-radius:10px;border:1px solid var(--glass-border);background:var(--glass-bg);backdrop-filter:blur(10px);display:flex;align-items:center;justify-content:center;transition:all 0.2s;cursor:pointer;';
    btn.innerHTML = '<i id="themeIcon" data-lucide="sun" style="width:18px;height:18px;opacity:0.7"></i>';
    btn.onmouseenter = () => { btn.style.background = 'var(--glass-bg-hover)'; btn.style.borderColor = 'var(--glass-border-hover)'; };
    btn.onmouseleave = () => { btn.style.background = 'var(--glass-bg)'; btn.style.borderColor = 'var(--glass-border)'; };
    document.body.appendChild(btn);
  }
  if (typeof lucide !== 'undefined') lucide.createIcons();
}

// Check session on load
api('/admin/me').then(data => {
  if (data.admin) { admin = data.admin; showApp(); handleRoute(); }
}).catch(() => {});

// Enter key for login
document.getElementById('loginPassword').addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

// ==================== Router ====================
window.addEventListener('hashchange', handleRoute);
window.addEventListener('load', () => setTimeout(handleRoute, 100));

function handleRoute() {
  if (document.getElementById('appPage').classList.contains('hidden')) return;
  // Stop auto-refresh when leaving usage page
  if (location.hash !== '#/usage') stopUsageAutoRefresh();

  document.querySelectorAll('[data-nav]').forEach(a => a.classList.remove('active'));
  const hash = location.hash || '#/dashboard';
  document.querySelector(`[href="${hash}"]`)?.classList.add('active');

  const routes = {
    '#/dashboard': renderDashboard,
    '#/users': renderUsers,
    '#/keys': renderKeys,
    '#/providers': renderProviders,
    '#/models': renderModels,
    '#/routes': renderRoutes,
    '#/usage': renderUsage,
    '#/billing': renderBilling,
  };

  const handler = routes[hash];
  if (handler) handler();
  else document.getElementById('mainContent').innerHTML = '<div class="empty">Page not found</div>';
}

// ==================== Modal ====================
function openModal(html) {
  document.getElementById('modalContent').innerHTML = html;
  document.getElementById('modalOverlay').classList.add('active');
}
function closeModal() {
  document.getElementById('modalOverlay').classList.remove('active');
}
document.getElementById('modalOverlay').addEventListener('click', e => {
  if (e.target === document.getElementById('modalOverlay')) closeModal();
});

// ==================== Helpers ====================
function fmt$(cents) { return '$' + (cents / 100).toFixed(2); }
function fmtM(n) { return n >= 1e6 ? (n / 1e6).toFixed(2) + 'M' : n >= 1e3 ? (n / 1e3).toFixed(1) + 'K' : String(n); }
function fmtTtft(ms) {
  if (!ms) return '-';
  const color = ms < 3000 ? 'var(--accent-green)' : ms < 10000 ? 'var(--accent-yellow)' : 'var(--accent-red)';
  return `<span style="color:${color}">${ms >= 1000 ? (ms / 1000).toFixed(1) + 's' : ms + 'ms'}</span>`;
}
function fmtBeijing(isoStr, mode) {
  if (!isoStr) return '-';
  const d = new Date((isoStr.endsWith('Z') ? isoStr : isoStr + 'Z'));
  const s = d.toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai', hour12: false });
  return mode === 'short' ? s.slice(5, 16) : mode === 'date' ? s.slice(0, 10) : s;
}
function fmtNum(n) { return (n || 0).toLocaleString(); }
function esc(s) { return s ? String(s).replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
function statusBadge(active) { return `<span class="badge ${active ? 'active' : 'inactive'}">${active ? 'Active' : 'Inactive'}</span>`; }
function copyToClipboard(text) {
  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text);
  } else {
    const ta = document.createElement('textarea');
    ta.value = text;
    ta.style.cssText = 'position:fixed;left:-9999px';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
  }
}

// ==================== Pages ====================

function scrollToChart(id) {
  const el = document.getElementById(id);
  if (!el) return;
  el.scrollIntoView({ behavior: 'smooth', block: 'center' });
  el.classList.add('highlight');
  setTimeout(() => el.classList.remove('highlight'), 1500);
}

let dashboardRange = 'today';
let dashboardProvider = '';

async function renderDashboard() {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';

  const provParam = dashboardProvider ? `provider=${encodeURIComponent(dashboardProvider)}` : '';
  const provSuffix = provParam ? `&${provParam}` : '';
  const [provData, stats, rawChartData] = await Promise.all([
    cachedApi('/admin/providers'),
    cachedApi(`/admin/dashboard/stats?range=${dashboardRange}${provSuffix}`),
    dashboardRange === 'today'
      ? cachedApi(`/admin/dashboard/hourly-usage?${provParam}`).then(r => r.hours)
      : cachedApi(`/admin/dashboard/daily-usage?days=${dashboardRange === '7d' ? 7 : 30}${provSuffix}`).then(r => r.days),
  ]);

  const rangeLabel = { today: 'Today', '7d': '7 Days', '30d': '30 Days' }[dashboardRange];
  let chartData = rawChartData;
  const rangeData = rawChartData;
  const isHourly = dashboardRange === 'today';

  c.innerHTML = `
    <div class="header"><h1>Dashboard</h1><div class="user-info">Admin: <span>${esc(admin?.username || '')}</span></div></div>
    <div class="cards">
      <div class="card glass" onclick="scrollToChart('chartRequests')"><div class="label">Requests (${rangeLabel})</div><div class="value green">${fmtNum(stats.range_requests)}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="scrollToChart('chartTokens')"><div class="label">Tokens (${rangeLabel})</div><div class="value purple">${fmtM(stats.range_tokens || 0)}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="scrollToChart('chartCost')"><div class="label">Cost (${rangeLabel})</div><div class="value yellow">$${stats.range_cost_usd}</div><div class="link-hint">View trend &darr;</div></div>
      <div class="card glass" onclick="location.hash='#/users'"><div class="label">Total Users</div><div class="value blue">${stats.total_users}</div><div class="link-hint">Users &rarr;</div></div>
      <div class="card glass" onclick="location.hash='#/usage'"><div class="label">Total Requests</div><div class="value blue">${fmtNum(stats.total_requests)}</div><div class="link-hint">Usage logs &rarr;</div></div>
      <div class="card glass" onclick="location.hash='#/billing'"><div class="label">Total Cost</div><div class="value yellow">$${stats.total_cost_usd}</div><div class="link-hint">Billing &rarr;</div></div>
    </div>
    <div style="display:flex;gap:8px;margin-bottom:20px;align-items:center;flex-wrap:wrap;">
      <button class="range-btn ${dashboardRange === 'today' ? 'active' : ''}" onclick="dashboardRange='today';renderDashboard()">Today</button>
      <button class="range-btn ${dashboardRange === '7d' ? 'active' : ''}" onclick="dashboardRange='7d';renderDashboard()">7 Days</button>
      <button class="range-btn ${dashboardRange === '30d' ? 'active' : ''}" onclick="dashboardRange='30d';renderDashboard()">30 Days</button>
      <select style="margin-left:8px;min-width:180px;padding:6px 14px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:20px;color:var(--text-primary);font-size:13px;font-family:inherit;cursor:pointer;transition:all 0.2s;backdrop-filter:blur(10px)" onchange="dashboardProvider=this.value;renderDashboard()">
        <option value="">All Providers</option>
        ${(provData.providers || []).map(p => `<option value="${esc(p.name)}" ${dashboardProvider === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>
    </div>
    <div class="charts-grid">
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-blue);box-shadow:0 0 8px var(--accent-blue)"></span> Requests</div>
        <canvas id="chartRequests"></canvas>
      </div>
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-purple);box-shadow:0 0 8px var(--accent-purple)"></span> Tokens${isHourly ? ' (K)' : ' (M)'}</div>
        <canvas id="chartTokens"></canvas>
      </div>
      <div class="chart-card glass-static">
        <div class="chart-title"><span class="dot" style="background:var(--accent-yellow);box-shadow:0 0 8px var(--accent-yellow)"></span> Cost ($)</div>
        <canvas id="chartCost"></canvas>
      </div>
    </div>
  `;

  // Build chart data: fill missing hours for hourly view (convert to Beijing time)
  const bjOffset = 8 * 60; // UTC+8 in minutes
  let labels;
  if (isHourly) {
    const hourMap = {};
    rangeData.forEach(d => {
      // Convert server hour to Beijing hour
      const utcH = parseInt((d.hour || '').slice(11, 13));
      const bjH = (utcH + 8) % 24;
      hourMap[String(bjH).padStart(2, '0')] = d;
    });
    chartData = Array.from({ length: 24 }, (_, i) => {
      const h = String(i).padStart(2, '0');
      const d = hourMap[h];
      return d || { requests: 0, tokens: 0, cost_cents: 0 };
    });
    labels = chartData.map((_, i) => String(i).padStart(2, '0') + ':00');
  } else {
    chartData = rangeData;
    labels = rangeData.map(d => {
      if (!d.date) return '';
      const dt = new Date(d.date + 'T00:00:00Z');
      return dt.toLocaleString('sv-SE', { timeZone: 'Asia/Shanghai' }).slice(5, 10);
    });
  }
  const isLight = getTheme() === 'light';
  const gridColor = isLight ? 'rgba(0,0,0,0.05)' : 'rgba(255,255,255,0.03)';
  const tickColor = isLight ? '#8888a8' : '#6060a0';
  const borderColor = isLight ? 'rgba(0,0,0,0.06)' : 'rgba(255,255,255,0.05)';
  const tickFont = { size: 10 };

  if (chartData.length > 0) {
    requestAnimationFrame(() => {
    // Requests chart
    new Chart(document.getElementById('chartRequests'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => d.requests),
          borderColor: '#00d4ff',
          backgroundColor: 'rgba(0, 212, 255, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#00d4ff',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });

    // Tokens chart
    new Chart(document.getElementById('chartTokens'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => isHourly ? Math.round((d.tokens || 0) / 1000) : +((d.tokens || 0) / 1e6).toFixed(2)),
          borderColor: '#b44dff',
          backgroundColor: 'rgba(180, 77, 255, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#b44dff',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });

    // Cost chart
    new Chart(document.getElementById('chartCost'), {
      type: 'line',
      data: {
        labels,
        datasets: [{
          data: chartData.map(d => (d.cost_cents / 100).toFixed(2)),
          borderColor: '#ffd000',
          backgroundColor: 'rgba(255, 208, 0, 0.08)',
          borderWidth: 2, pointRadius: 3, pointBackgroundColor: '#ffd000',
          pointHoverRadius: 6, tension: 0.4, fill: true,
        }],
      },
      options: {
        responsive: true, maintainAspectRatio: false,
        plugins: { legend: { display: false } },
        scales: {
          x: { ticks: { color: tickColor, font: tickFont, maxRotation: 0, maxTicksLimit: isHourly ? 12 : 15 }, grid: { color: gridColor }, border: { color: borderColor } },
          y: { ticks: { color: tickColor, font: tickFont, callback: v => '$' + v }, grid: { color: gridColor }, border: { color: borderColor }, beginAtZero: true },
        },
      },
    });
    });
  }
}

// ==================== User Section (independent time range) ====================
async function renderUserSection() {
  const distRange = window._userDistRange || 'today';
  const rankRange = window._userRankRange || 'today';
  const [distUsers, rankUsers] = await Promise.all([
    cachedApi(`/admin/dashboard/user-stats?range=${distRange}`),
    cachedApi(`/admin/dashboard/user-stats?range=${rankRange}`),
  ]);
  const distLabel = { today: 'Today', '7d': '7 Days', '30d': '30 Days' }[distRange];
  const rankLabel = { today: 'Today', '7d': '7 Days', '30d': '30 Days' }[rankRange];

  // Update section titles
  const section = document.getElementById('userSection');
  if (!section) return;
  const titles = section.querySelectorAll('.section-title');
  if (titles[0]) titles[0].innerHTML = `<i data-lucide="pie-chart" style="width:18px;height:18px"></i> User Distribution
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="range-btn ${distRange === 'today' ? 'active' : ''}" onclick="window._userDistRange='today';renderUserSection()">Today</button>
      <button class="range-btn ${distRange === '7d' ? 'active' : ''}" onclick="window._userDistRange='7d';renderUserSection()">7 Days</button>
      <button class="range-btn ${distRange === '30d' ? 'active' : ''}" onclick="window._userDistRange='30d';renderUserSection()">30 Days</button>
    </div>`;
  if (titles[1]) titles[1].innerHTML = `<i data-lucide="trophy" style="width:18px;height:18px"></i> User Ranking
    <div style="margin-left:auto;display:flex;gap:6px">
      <button class="range-btn ${rankRange === 'today' ? 'active' : ''}" onclick="window._userRankRange='today';renderUserSection()">Today</button>
      <button class="range-btn ${rankRange === '7d' ? 'active' : ''}" onclick="window._userRankRange='7d';renderUserSection()">7 Days</button>
      <button class="range-btn ${rankRange === '30d' ? 'active' : ''}" onclick="window._userRankRange='30d';renderUserSection()">30 Days</button>
    </div>`;
  if (typeof lucide !== 'undefined') lucide.createIcons();

  // Render distribution charts
  const isLight = getTheme() === 'light';
  const legendColor = isLight ? '#4a4a6a' : '#9090b0';
  const chartColors = ['#00d4ff','#b44dff','#00ffaa','#ffd000','#ff4d6a','#00aaff','#ff8844','#44ddff','#dd44ff','#88ff44'];
  function buildDoughnutData(arr, key, topN = 10) {
    const sorted = [...arr].sort((a, b) => (b[key] || 0) - (a[key] || 0));
    const top = sorted.slice(0, topN); const rest = sorted.slice(topN);
    const restVal = rest.reduce((s, r) => s + (r[key] || 0), 0);
    const labels = top.map(u => u.user_name || u.user_id?.slice(0, 8));
    const data = top.map(u => key === 'cost_cents' ? +(u[key] / 100).toFixed(2) : u[key] || 0);
    const colors = top.map((_, i) => chartColors[i % chartColors.length]);
    if (restVal > 0) { labels.push('Others'); data.push(key === 'cost_cents' ? +(restVal / 100).toFixed(2) : restVal); colors.push('#404060'); }
    return { labels, data, colors };
  }

  // Destroy old chart instances
  ['chartUserRequests','chartUserTokens','chartUserCost'].forEach(id => {
    const existing = Chart.getChart(id);
    if (existing) existing.destroy();
  });

  const du = distUsers.users || [];
  if (du.length > 0) {
    requestAnimationFrame(() => {
      const rd = buildDoughnutData(du,'requests');
      const td = buildDoughnutData(du,'tokens');
      const cd = buildDoughnutData(du,'cost_cents');
      const doughnutOpts = (labels, data, colors, cb) => ({ type:'doughnut', data:{labels,datasets:[{data,backgroundColor:colors,borderWidth:0,hoverOffset:8}]}, options:{responsive:true,maintainAspectRatio:false,cutout:'55%',plugins:{legend:{position:'right',labels:{color:legendColor,font:{size:11},boxWidth:12,padding:8,...(cb?{callback:cb}:{})}}}} });
      new Chart(document.getElementById('chartUserRequests'), doughnutOpts(rd.labels, rd.data, rd.colors));
      new Chart(document.getElementById('chartUserTokens'), doughnutOpts(td.labels, td.data, td.colors));
      const costLabels = cd.labels;
      const costVals = cd.data;
      new Chart(document.getElementById('chartUserCost'), doughnutOpts(costLabels, costVals, cd.colors, function(v){ return v+' ($'+costVals[costLabels.indexOf(v)]+')'; }));
    });
  }

  // Render ranking table
  const ru = rankUsers.users || [];
  document.getElementById('userRankTable').innerHTML = `
    <table>
      <tr><th>#</th><th>User</th><th>Requests</th><th>Tokens</th><th>Cost</th><th>Errors</th><th>Error Rate</th><th>Last Active</th></tr>
      ${ru.length === 0 ? '<tr><td colspan="8" style="text-align:center;color:var(--text-muted);padding:30px">No data</td></tr>' : ru.map((u, i) => {
        const rankClass = i < 3 ? `rank-badge rank-${i + 1}` : '';
        const errorRate = u.requests > 0 ? ((u.errors / u.requests) * 100).toFixed(1) : '0.0';
        const errorRateColor = parseFloat(errorRate) > 5 ? 'var(--accent-red)' : parseFloat(errorRate) > 0 ? 'var(--accent-yellow)' : 'var(--text-muted)';
        return `<tr>
          <td>${i < 3 ? `<span class="${rankClass}">${i + 1}</span>` : (i + 1)}</td>
          <td style="color:var(--text-primary);font-weight:500">${esc(u.user_name || u.user_id?.slice(0, 8))}</td>
          <td>${fmtNum(u.requests)}</td>
          <td>${fmtNum(u.tokens)}</td>
          <td style="color:var(--accent-yellow)">${fmt$(u.cost_cents)}</td>
          <td>${u.errors || 0}</td>
          <td style="color:${errorRateColor}">${errorRate}%</td>
          <td style="font-size:12px">${fmtBeijing(u.last_active, 'short')}</td>
        </tr>`;
      }).join('')}
    </table>`;
}

    provider_id: sel.value,
    provider_model_id: modelInputs[i].value,
  })).filter(e => e.provider_model_id);

  await api('/admin/routes', { method: 'POST', body: JSON.stringify({ model_id, entries }) });
  closeModal(); renderRoutes();
}

async function deleteRoute(id) {
  if (!confirm('Delete this route?')) return;
  await api(`/admin/routes/${id}`, { method: 'DELETE' });
  renderRoutes();
}

// ==================== Usage Logs ====================
async function fetchUsers() {
  const data = await cachedApi('/admin/users', 60000);
  return data.users || [];
}

function userSelectHtml(selectedId) {
  // Build options async — return placeholder, populate after
  return `<select id="filterUser" onchange="applyUsageFilter()" style="min-width:160px">
    <option value="">All Users</option>
  </select>`;
}

async function populateUserSelect(selectId, selectedId) {
  const users = await fetchUsers();
  const sel = document.getElementById(selectId);
  if (!sel) return;
  sel.innerHTML = '<option value="">All Users</option>' +
    users.map(u => `<option value="${u.id}" ${u.id === selectedId ? 'selected' : ''}>${esc(u.name || u.email || u.id?.slice(0, 8))}</option>`).join('');
}

// ==================== Usage Auto-Refresh ====================
let _usageAutoRefreshTimer = null;
let _usageAutoRefreshEnabled = true;
let _usageAutoRefreshInterval = 10; // seconds
let _usageCurrentPage = 1;

function stopUsageAutoRefresh() {
  if (_usageAutoRefreshTimer) { clearInterval(_usageAutoRefreshTimer); _usageAutoRefreshTimer = null; }
}

function _usageBuildParams(page) {
  const params = new URLSearchParams();
  const filterUser = window._usageFilterUser || '';
  const filterProvider = window._usageFilterProvider || '';
  const filterStatus = window._usageFilterStatus || '';
  const filterDateFrom = window._usageFilterDateFrom || '';
  const filterDateTo = window._usageFilterDateTo || '';
  if (filterUser) params.set('user_id', filterUser);
  if (filterProvider) params.set('provider', filterProvider);
  if (filterStatus) params.set('status', filterStatus);
  if (filterDateFrom) params.set('date_from', filterDateFrom);
  if (filterDateTo) params.set('date_to', filterDateTo);
  params.set('page', page);
  return params;
}

function _usageRenderRows(data, page) {
  const totalPages = Math.ceil(data.total / data.limit);
  const tbody = document.getElementById('usageTableBody');
  if (!tbody) return;
  tbody.innerHTML = data.logs.map(l => `
    <tr>
      <td style="white-space:nowrap;font-size:12px">${fmtBeijing(l.created_at)}</td>
      <td style="color:var(--text-primary)">${esc(l.user_name)}</td>
      <td><code>${esc(l.model_id)}</code></td>
      <td>${esc(l.provider_name)}</td>
      <td>${fmtNum(l.total_tokens)}</td>
      <td style="color:var(--accent-yellow)">${fmt$(l.cost_cents)}</td>
      <td>${l.latency_ms ? l.latency_ms + 'ms' : '-'}</td>
      <td>${fmtTtft(l.ttft_ms)}</td>
      <td><span class="badge ${l.status}">${l.status}</span></td>
    </tr>
  `).join('');
  const emptyEl = document.getElementById('usageEmpty');
  if (emptyEl) emptyEl.style.display = data.logs.length === 0 ? '' : 'none';
  const pagEl = document.getElementById('usagePagination');
  if (pagEl) pagEl.innerHTML = totalPages > 1
    ? `<button ${page <= 1 ? 'disabled' : ''} onclick="renderUsage(${page - 1})">&larr; Prev</button><span>${page} / ${totalPages} &nbsp;(${data.total} total)</span><button ${page >= totalPages ? 'disabled' : ''} onclick="renderUsage(${page + 1})">Next &rarr;</button>`
    : (data.total > 0 ? `<span>Total: ${data.total}</span>` : '');
}

async function refreshUsageTable() {
  try {
    const data = await api(`/admin/usage?${_usageBuildParams(_usageCurrentPage)}`);
    _usageRenderRows(data, _usageCurrentPage);
  } catch (e) {}
}

function startUsageAutoRefresh() {
  stopUsageAutoRefresh();
  if (!_usageAutoRefreshEnabled) return;
  _usageAutoRefreshTimer = setInterval(() => {
    if (location.hash === '#/usage') refreshUsageTable();
  }, _usageAutoRefreshInterval * 1000);
  updateAutoRefreshUI();
}

function toggleUsageAutoRefresh() {
  _usageAutoRefreshEnabled = !_usageAutoRefreshEnabled;
  if (_usageAutoRefreshEnabled) startUsageAutoRefresh();
  else stopUsageAutoRefresh();
  updateAutoRefreshUI();
}

function setUsageRefreshInterval(sec) {
  _usageAutoRefreshInterval = sec;
  if (_usageAutoRefreshEnabled) startUsageAutoRefresh();
  updateAutoRefreshUI();
}

function updateAutoRefreshUI() {
  const indicator = document.getElementById('autoRefreshIndicator');
  if (!indicator) return;
  if (_usageAutoRefreshEnabled) {
    indicator.innerHTML = `<span class="badge active" style="font-size:11px">Auto</span> <select onchange="setUsageRefreshInterval(+this.value)" style="padding:4px 8px;background:var(--glass-bg);border:1px solid var(--glass-border);border-radius:6px;color:var(--text-primary);font-size:12px;font-family:inherit">${[5,10,15,30,60].map(s => `<option value="${s}" ${s === _usageAutoRefreshInterval ? 'selected' : ''}>${s}s</option>`).join('')}</select>`;
  } else {
    indicator.innerHTML = `<span class="badge inactive" style="font-size:11px">Paused</span>`;
  }
}

async function renderUsage(page = 1) {
  _usageCurrentPage = page;
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  try {
  const [users, provData] = await Promise.all([fetchUsers(), cachedApi('/admin/providers')]);
  const data = await api(`/admin/usage?${_usageBuildParams(page)}`);
  const totalPages = Math.ceil(data.total / data.limit);
  const filterUser = window._usageFilterUser || '';
  const filterProvider = window._usageFilterProvider || '';
  const filterStatus = window._usageFilterStatus || '';
  const filterDateFrom = window._usageFilterDateFrom || '';
  const filterDateTo = window._usageFilterDateTo || '';

  c.innerHTML = `
    <div class="header"><h1>Usage Logs</h1><div style="display:flex;align-items:center;gap:8px">
      <span id="autoRefreshIndicator"></span>
      <button class="btn sm" onclick="toggleUsageAutoRefresh()" title="${_usageAutoRefreshEnabled ? 'Pause' : 'Resume'} auto-refresh"><i data-lucide="${_usageAutoRefreshEnabled ? 'pause' : 'play'}" style="width:14px;height:14px"></i></button>
    </div></div>
    <div class="toolbar">
      <select id="filterUser" style="min-width:160px" onchange="window._usageFilterUser=this.value;renderUsage(1)">
        <option value="">All Users</option>
        ${users.map(u => `<option value="${u.id}" ${u.id === filterUser ? 'selected' : ''}>${esc(u.name || u.email || u.id?.slice(0, 8))}</option>`).join('')}
      </select>
      <select id="filterProvider" style="min-width:160px" onchange="window._usageFilterProvider=this.value;renderUsage(1)">
        <option value="">All Providers</option>
        ${(provData.providers || []).map(p => `<option value="${esc(p.name)}" ${filterProvider === p.name ? 'selected' : ''}>${esc(p.name)}</option>`).join('')}
      </select>
      <select id="filterStatus" style="min-width:120px" onchange="window._usageFilterStatus=this.value;renderUsage(1)">
        <option value="">All Status</option>
        <option value="success" ${filterStatus === 'success' ? 'selected' : ''}>Success</option>
        <option value="error" ${filterStatus === 'error' ? 'selected' : ''}>Error</option>
        <option value="cancelled" ${filterStatus === 'cancelled' ? 'selected' : ''}>Cancelled</option>
      </select>
      <input type="text" id="usageDateFrom" placeholder="From date" style="min-width:140px" value="${esc(filterDateFrom)}">
      <span style="color:var(--text-muted)">~</span>
      <input type="text" id="usageDateTo" placeholder="To date" style="min-width:140px" value="${esc(filterDateTo)}">
      ${(filterDateFrom || filterDateTo) ? `<button class="btn sm" onclick="window._usageFilterDateFrom='';window._usageFilterDateTo='';renderUsage(1)">Clear</button>` : ''}
    </div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Time</th><th>User</th><th>Model</th><th>Provider</th><th>Tokens</th><th>Cost</th><th>Latency</th><th>TTFT</th><th>Status</th></tr>
      <tbody id="usageTableBody"></tbody>
    </table>
    </div>
    <div id="usageEmpty" style="${data.logs.length === 0 ? '' : 'display:none'}" class="empty">No usage logs yet</div>
    <div id="usagePagination" class="pagination"></div>
  `;
  _usageRenderRows(data, page);
  if (typeof lucide !== 'undefined') lucide.createIcons();
  updateAutoRefreshUI();
  startUsageAutoRefresh();
  flatpickr('#usageDateFrom', { locale: 'en', dateFormat: 'Y-m-d', onChange(sel) { window._usageFilterDateFrom = sel[0] ? sel[0] : ''; renderUsage(); } });
  flatpickr('#usageDateTo', { locale: 'en', dateFormat: 'Y-m-d', onChange(sel) { window._usageFilterDateTo = sel[0] ? sel[0] : ''; renderUsage(); } });
  } catch (e) { c.innerHTML = '<div class="empty">Failed to load usage logs</div>'; }
}

// ==================== Billing ====================
async function renderBilling(page = 1) {
  const c = document.getElementById('mainContent');
  c.innerHTML = '<h1>Loading...</h1>';
  const users = await fetchUsers();
  const params = new URLSearchParams();
  const filterUser = window._billingFilterUser || '';
  const filterDateFrom = window._billingFilterDateFrom || '';
  const filterDateTo = window._billingFilterDateTo || '';
  if (filterUser) params.set('user_id', filterUser);
  if (filterDateFrom) params.set('date_from', filterDateFrom);
  if (filterDateTo) params.set('date_to', filterDateTo);
  params.set('page', page);
  const data = await api(`/admin/billing/transactions?${params}`);
  const totalPages = Math.ceil(data.total / data.limit);

  c.innerHTML = `
    <div class="header"><h1>Billing / Transactions</h1></div>
    <div class="toolbar">
      <select id="filterBillingUser" style="min-width:160px" onchange="window._billingFilterUser=this.value;renderBilling(1)">
        <option value="">All Users</option>
        ${users.map(u => `<option value="${u.id}" ${u.id === filterUser ? 'selected' : ''}>${esc(u.name || u.email || u.id?.slice(0, 8))}</option>`).join('')}
      </select>
      <input type="text" id="billingDateFrom" placeholder="From date" style="min-width:140px" value="${esc(filterDateFrom)}">
      <span style="color:var(--text-muted)">~</span>
      <input type="text" id="billingDateTo" placeholder="To date" style="min-width:140px" value="${esc(filterDateTo)}">
      ${(filterDateFrom || filterDateTo) ? `<button class="btn sm" onclick="window._billingFilterDateFrom='';window._billingFilterDateTo='';renderBilling(1)">Clear dates</button>` : ''}
    </div>
    <div class="table-wrap glass-static" style="padding:4px">
    <table>
      <tr><th>Time</th><th>User</th><th>Type</th><th>Amount</th><th>Balance After</th><th>Description</th></tr>
      ${data.transactions.map(t => `
        <tr>
          <td style="white-space:nowrap;font-size:12px">${fmtBeijing(t.created_at)}</td>
          <td style="color:var(--text-primary)">${esc(t.user_name)}</td>
          <td><span class="badge ${t.type === 'topup' ? 'success' : ''}">${t.type}</span></td>
          <td style="color:${t.amount_cents > 0 ? 'var(--accent-green)' : 'var(--accent-red)'};font-weight:500">${t.amount_cents > 0 ? '+' : ''}${fmt$(t.amount_cents)}</td>
          <td style="color:var(--accent-yellow)">${fmt$(t.balance_after_cents)}</td>
          <td>${esc(t.description)}</td>
        </tr>
      `).join('')}
    </table>
    </div>
    ${data.transactions.length === 0 ? '<div class="empty">No transactions yet</div>' : ''}
    ${totalPages > 1 ? `<div class="pagination"><button ${page <= 1 ? 'disabled' : ''} onclick="renderBilling(${page - 1})">&larr; Prev</button><span>${page} / ${totalPages} &nbsp;(${data.total} total)</span><button ${page >= totalPages ? 'disabled' : ''} onclick="renderBilling(${page + 1})">Next &rarr;</button></div>` : (data.total > 0 ? `<div class="pagination"><span>Total: ${data.total}</span></div>` : '')}
  `;
  flatpickr('#billingDateFrom', { locale: 'en', dateFormat: 'Y-m-d', onChange(sel) { window._billingFilterDateFrom = sel[0] ? sel[0] : ''; renderBilling(); } });
  flatpickr('#billingDateTo', { locale: 'en', dateFormat: 'Y-m-d', onChange(sel) { window._billingFilterDateTo = sel[0] ? sel[0] : ''; renderBilling(); } });
}
</script>
